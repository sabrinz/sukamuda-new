    <!-- ===== PEMUAT TERTUNDA: Analytics + AdSense ===== -->
    <script>
      (function () {
        var sudahDimuat = false;
        var proto = "ht" + "tps://";
        var sumberGA = proto + "www.googletagmanager.com/gtag/js?id=G-3YC85W3DEJ";
        var sumberIklan = proto + "pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7608424206122269";

        function tambah(src, pakaiCors) {
          var s = document.createElement("script");
          s.async = true;
          s.src = src;
          if (pakaiCors) s.crossOrigin = "anonymous";
          document.head.appendChild(s);
        }

        function muat() {
          if (sudahDimuat) return;
          sudahDimuat = true;
          tambah(sumberGA, false);
          tambah(sumberIklan, true);
        }

        var peristiwa = ["scroll", "mousemove", "touchstart", "click", "keydown"];
        for (var i = 0; i < peristiwa.length; i++) {
          window.addEventListener(peristiwa[i], muat, { once: true, passive: true });
        }

        if (document.readyState === "complete") {
          setTimeout(muat, 2500);
        } else {
          window.addEventListener("load", function () {
            setTimeout(muat, 2500);
          });
        }
      })();
    </script>
